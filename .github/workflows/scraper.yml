name: Scheduled Price Scraper & Matcher

on:
  schedule:
    # Roda às 11:00 UTC (08:00 horário de Brasília) às terças (2) e quintas (4)
    - cron: '0 11 * * 2,4'
  workflow_dispatch: # Permite disparo manual via painel do GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase python-dotenv rapidfuzz

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scraper
          python main.py all

      - name: Run Matcher & Persist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scraper
          python matcher.py