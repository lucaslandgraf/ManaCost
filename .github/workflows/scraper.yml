name: Supermarket Deals Scraper

on:
  schedule:
    # 09:00 UTC = 06:00 no fuso horário de Brasília (UTC-3)
    # Segundas-feiras (1) e Quintas-feiras (4)
    - cron: '0 9 * * 1,4'
  workflow_dispatch: # Permite execução manual pelo painel do GitHub Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Execute Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scraper/ingest_deals.py